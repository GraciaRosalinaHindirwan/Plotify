<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <!-- link -->
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="dashboard-admin.css">
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <!-- Logo -->
            <div class="sidebar-header">
                <img src="img/Logo.png" alt="Logo" class="logo-img">
                <h2 class="logo-text">Admin </h2>
            </div>

            <hr class="divider">

            <!-- Menu -->
            <ul class="menu">
                <li class="menu-item active">
                    <img src="img/dashboard.png" class="icon">
                    <span>Dashboard</span>
                </li>

                <li class="menu-item dropdown">

                    <div class="menu-main" onclick="toggleDropdown()">

                        <div class="menu-left">
                            <img src="img/account.png" class="icon">
                            <span>Manajemen Akun</span>
                        </div>

                        <img src="img/drop-down.png" class="arrow">

                    </div>

                    <ul class="submenu" id="submenu">
                        <li>
                            Registrasi Agen dan Notaris
                        </li>
                        <li>
                            Daftar Pengguna
                        </li>
                    </ul>
                </li>
            </ul>

            <!-- Logout -->
            <hr class="divider">
            <div class="logout">
                <img src="img/logout.png" class="icon">
                <span>Logout</span>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="main-content">

           <div class="content-header">
                <h3 class="title">Dashboard</h3>
                <div class="header-right">
                    <div class="profile">
                        <h3 class="admin-name">Admin User</h3>
                        <p class="admin-role">Administrator</p>
                    </div>

                    <div class="avatar">
                        AU
                    </div>
                </div>
            </div>
            <hr class="divider">

            <div class="header-right">
                <img src="img/dashboard.png" alt="" id="dashboard-logo">
                <div class="content-body">
                    <p class="body-text-title">Dashboard Overview</p>
                    <p class="body-text">Ringkasan data sistem platform properti</p>
                </div>
            </div>

            <div class="cards">
                <div class="card-stat">
                    <div class="card-top">
                        <div class="icon-box">
                            <i class="bi bi-people"></i>
                        </div>
                        <span>Total Agen</span>
                    </div>

                    <div class="card-number">
                        124
                    </div>
                </div>

                <div class="card-stat">
                    <div class="card-top">
                        <div class="icon-box">
                            <i class="bi bi-person-badge"></i>
                        </div>
                        <span>Total Notaris</span>
                    </div>

                    <div class="card-number">
                        45
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
<script>
    function toggleDropdown() {
        document.getElementById("submenu").classList.toggle("show");
    }
</script>

</html>
